<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(129, 140, 248, 0.4)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 15px rgba(192, 132, 252, 0.8)); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes slide {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#text-grad);
      animation: pulse 4s ease-in-out infinite;
      transform-origin: 400px 120px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .floating-emoji {
      font-family: 'Segoe UI', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
      font-size: 36px;
      animation: float 6s ease-in-out infinite;
    }
    .emoji-1 { animation-delay: 0s; transform-origin: 100px 80px; }
    .emoji-2 { animation-delay: 1.5s; transform-origin: 700px 70px; }
    .emoji-3 { animation-delay: 3s; transform-origin: 150px 220px; }
    .emoji-4 { animation-delay: 4.5s; transform-origin: 680px 210px; }
    
    .orbit-parent {
      animation: spin 20s linear infinite;
      transform-origin: 400px 150px;
    }
    
    .border-rect {
      stroke: url(#text-grad);
      stroke-width: 2;
      stroke-dasharray: 20 10;
      animation: slide 10s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="300" rx="16" fill="url(#bg-grad)" />
  
  <!-- Border with moving dashes -->
  <rect x="10" y="10" width="780" height="280" rx="12" fill="none" class="border-rect" />

  <!-- Orbiting small sparkles -->
  <g class="orbit-parent">
    <text x="350" y="50" font-size="20">✨</text>
    <text x="450" y="250" font-size="20">✨</text>
  </g>

  <!-- Floating Main Emojis -->
  <g class="floating-emoji emoji-1">
    <text x="100" y="80">🎯</text>
  </g>
  <g class="floating-emoji emoji-2">
    <text x="700" y="70">😀</text>
  </g>
  <g class="floating-emoji emoji-3">
    <text x="150" y="220">🔥</text>
  </g>
  <g class="floating-emoji emoji-4">
    <text x="680" y="210">🚀</text>
  </g>

  <!-- Text Content -->
  <text x="400" y="135" text-anchor="middle" class="title">Emoji Picker</text>
  <text x="400" y="180" text-anchor="middle" class="subtitle">Seamless emoji injection anywhere on the web</text>
  <text x="400" y="220" text-anchor="middle" font-size="14" fill="#64748b" font-family="'Segoe UI', sans-serif">Lightweight • Manifest V3 • Dark Mode Support</text>
</svg>
